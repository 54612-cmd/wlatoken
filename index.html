<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORLD LOVE ALLIANCE - $LOVE Official</title>
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
        .container { padding: 30px 10px; max-width: 800px; margin: auto; }
        
        .moneda { width: 140px; filter: drop-shadow(0 0 15px #d4af37); animation: float 4s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        h1 { color: #d4af37; font-size: 1.8rem; margin: 15px 0; text-transform: uppercase; letter-spacing: 2px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 40px; align-items: center; }
        .btn { display: block; padding: 18px; border-radius: 50px; font-weight: bold; text-decoration: none; width: 90%; max-width: 400px; }
        .btn-main { background: linear-gradient(135deg, #d4af37, #f2d06b); color: #000; }
        .btn-dex { background: #1b212d; color: #00ffcc; border: 1px solid #00ffcc; font-size: 0.9rem; }

        /* GALERÍA VISUAL PURA */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 15px; 
            padding: 10px;
        }
        .nft-link { 
            display: block; 
            transition: 0.3s; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 1px solid #222;
        }
        .nft-link:hover { 
            transform: scale(1.05); 
            border-color: #ff1493; 
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.3); 
        }
        .nft-link img { 
            width: 100%; 
            display: block; 
            aspect-ratio: 1 / 1; 
            object-fit: cover; 
        }

        footer { padding: 50px; opacity: 0.3; font-size: 0.7rem; border-top: 1px solid #111; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
